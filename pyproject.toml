[project]
name = "goatedit-bridge"
version = "0.7.0"
description = "Local yt-dlp bridge for the GoatEdit yt-dlp plugin — downloads on your machine, imports into the editor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["yt-dlp", "youtube", "video", "goatedit", "video-editor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
# Unpinned on purpose: YouTube changes its signature cipher often and yt-dlp
# ships near-daily fixes. A pinned bridge is a broken bridge within weeks.
#
# The floor is not decoration. It sat at 2025.10.14 for eleven months, which let
# a bridge run a yt-dlp two months stale — and a stale one does not fail
# loudly: every YouTube download returns 403 Forbidden, which reads as a
# blocked IP or a bad token rather than as "update me". Raise this to whatever
# is known to work whenever that happens again.
# Pillow renders the title/caption cards the timeline compiler overlays. Without
# it the compiler still runs and every title silently vanishes from the export,
# which is the worst way to find out a dependency is missing.
dependencies = ["yt-dlp>=2026.08.19", "pillow>=10.0"]

[project.scripts]
goatedit-bridge = "goatedit_bridge.__main__:main"

[project.urls]
Homepage = "https://ai.goatedit.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goatedit_bridge"]
